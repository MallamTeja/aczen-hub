# Outreach automation Edge Functions are triggered internally by pg_cron, not by
# end users, so JWT verification is disabled; they are protected by the
# x-cron-secret header (CRON_SECRET) instead.
[functions.outreach-process]
verify_jwt = false

[functions.poll-replies]
verify_jwt = false

# Tracking endpoints are hit by recipients' mail clients / browsers (no auth),
# so JWT verification must be off. They only record opens/clicks by lead id.
[functions.track-open]
verify_jwt = false

[functions.track-click]
verify_jwt = false
